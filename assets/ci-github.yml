# PREGATE (ARCHITECTURE §4.5, MULTI-HARNESS MH-28), written by `pregate install --ci github`: the engine
# the base branch pins checks every pull request, whatever harness wrote the code.
name: PREGATE
on:
  pull_request:
jobs:
  pregate:
    runs-on: ubuntu-latest
    # A catastrophic regex in a `path` rule source hangs instead of failing; the job ends here (§6.1).
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "@ROOT@"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The release is public, so the job token can download it. The engine version comes from the
      # base branch lock: a pull request cannot select another binary by editing its own lock.
      # SHA256SUMS covers every asset. Cosign must verify SHA256SUMS and the archive before unpack.
      - name: Install the engine the base branch pins
        env:
          GH_TOKEN: ${{ secrets.PREGATE_RELEASES_TOKEN || github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          lock="@ROOT@/.pregate/pregate.lock.json"
          lock=${lock#./}
          version=$(git show "$BASE:$lock" | jq -r .engine)
          printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'
          tar="pregate-$version-linux-x64.tar.gz"
          cd "$RUNNER_TEMP"
          gh release download "v$version" -R pedroknigge/pregate -p "$tar" -p "$tar.bundle" -p SHA256SUMS -p SHA256SUMS.bundle
          sha256sum -c --ignore-missing SHA256SUMS
          identity='^https://github\.com/pedroknigge/pregate/\.github/workflows/release\.yml@refs/tags/v'
          cosign verify-blob --bundle SHA256SUMS.bundle \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          cosign verify-blob --bundle "$tar.bundle" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$tar"
          tar -xzf "$tar" pregate
          echo "PREGATE=$RUNNER_TEMP/pregate" >> "$GITHUB_ENV"
      - name: Test the path rule sources
        run: '"$PREGATE" rules test'
      # A change that loosens the contract fails here until a maintainer accepts that exact loosening:
      # the job prints its digest, and the repository variable PREGATE_ACCEPT_CONTRACT set to it (one
      # or more digests, separated by spaces or commas) accepts it. Repository variables are not part
      # of the change; protect .pregate/ and .github/workflows/ with CODEOWNERS so the change cannot
      # rewrite this job either.
      - name: Check the change against its base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PREGATE_ACCEPT_CONTRACT: ${{ vars.PREGATE_ACCEPT_CONTRACT }}
        run: '"$PREGATE" check --ratchet --base "$BASE"'
