# Weekly counts of merged pull requests and reverts. The token can read the repository and its
# pull requests, and it can upload this report. It cannot push, and it cannot comment.
name: Review trust
on:
  schedule:
    # Monday 12:00 UTC.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: "UTC date YYYY-MM-DD. Empty means 8 weeks before today."
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Write the report
        env:
          SINCE: ${{ github.event_name == 'workflow_dispatch' && inputs.since || '' }}
        run: |
          set -eu
          since="$SINCE"
          if [ -z "$since" ]; then since="$(date -u -d '8 weeks ago' +%Y-%m-%d)"; fi
          case "$since" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "since must be YYYY-MM-DD" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/review-trust"
          bun scripts/trust-metrics.ts --since "$since" --branch origin/main > "$RUNNER_TEMP/review-trust/trust.md"
          bun scripts/trust-metrics.ts --since "$since" --branch origin/main --json > "$RUNNER_TEMP/review-trust/trust.json"
          cat "$RUNNER_TEMP/review-trust/trust.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-trust
          path: ${{ runner.temp }}/review-trust
          if-no-files-found: error
