# PREGATE's own CI (ARCHITECTURE §2, §8): typecheck, unit tests, the release build for every target,
# the end-to-end suite on the compiled binary, and the gate on this repository's own change.
name: CI
on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:
  pull_request:
jobs:
  dcouplr-source:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Verify pack canaries against the pinned published runtime
        run: bun scripts/dcouplr-source-probe.ts --fetch
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      candidate_ready: ${{ steps.candidate.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install test shells
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Isolate runtime homes
        run: |
          root=/private/tmp/claude-501/pregate-ci
          sudo mkdir -p "$root"
          sudo chown "$(id -u):$(id -g)" "$root"
          for entry in HOME:home XDG_DATA_HOME:data XDG_STATE_HOME:state XDG_CONFIG_HOME:config TMPDIR:tmp CODEX_HOME:codex GROK_HOME:grok; do
            path="$root/${entry#*:}"
            mkdir -p "$path"
            echo "${entry%%:*}=$path" >> "$GITHUB_ENV"
          done
      - name: Git identity for fixture commits
        run: |
          git config --global user.email "pregate-ci@example.com"
          git config --global user.name "Pregate CI"
          git config --global commit.gpgsign false
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Documentation matches CLI and rule manifests
        run: |
          bun scripts/core-invariants.ts --check
          bun scripts/readiness-packs.ts --check
          bun scripts/dcouplr-delivery-rules.ts --check
          bun scripts/source-invariants.ts --check
          bun scripts/invariant-coverage.ts --check
          bun scripts/docs-reference.ts --check
          bun scripts/catch-all-lint.ts --check
      # Real Sigstore coverage. The default suite stays offline unless this variable is set.
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Unit tests
        env:
          PREGATE_E2E_SIGSTORE: "1"
        run: bun test --path-ignore-patterns 'test/{e2e,default-contract-budget.e2e}.test.ts'
      - name: End to end
        run: bun test test/e2e.test.ts
      # Fetches got and zod at pinned commits (network) and audits them with the auto-detected contract.
      - name: Default-contract findings budget
        env:
          PREGATE_BUDGET_E2E: "1"
        run: bun test test/default-contract-budget.e2e.test.ts
      # Catalog fixtures, all platform archives, both installers and SHA256SUMS.
      - name: Build
        run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: candidate
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            dist/pregate-*.tar.gz
            dist/pregate-*.zip
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
      # A push that creates the branch has 0000000 as its before, and a force push may name a commit
      # that is gone: the base is then the merge base with main or, failing that, the first commit.
      - name: Dogfooding
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          dist/pregate-*-linux-x64/pregate check --ratchet --base "$BASE"
  # The Windows suite runs in three jobs. A hosted Windows runner starts a compiled engine several
  # times slower than Linux, and one job ran 29 to 45 minutes against a 45-minute limit. The
  # steps that do not depend on the shard run in the first one. The job named `windows` below is
  # the required check: it passes only when every shard passed.
  windows-suite:
    name: windows (${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Isolate runtime homes
        shell: pwsh
        run: |
          $root = 'C:/private/tmp/claude-501/pregate-ci'
          $paths = @{ HOME='home'; USERPROFILE='home'; LOCALAPPDATA='data'; APPDATA='config'; XDG_DATA_HOME='data'; XDG_STATE_HOME='state'; XDG_CONFIG_HOME='config'; TMPDIR='tmp'; TEMP='tmp'; TMP='tmp'; CODEX_HOME='codex'; GROK_HOME='grok' }
          foreach ($entry in $paths.GetEnumerator()) {
            $path = "$root/$($entry.Value)"
            New-Item -ItemType Directory -Path $path -Force | Out-Null
            "$($entry.Key)=$path" >> $env:GITHUB_ENV
          }
          # Without AppData\Local under USERPROFILE, PowerShell writes this cache into its working directory.
          "PSModuleAnalysisCachePath=$root/powershell-module-analysis-cache" >> $env:GITHUB_ENV
      # Freshly compiled engines and a cold `go test` write many new binaries. Real-time scanning
      # of those files is what pushed the Go demo past its compile budget and the first public
      # install past its process budget. The isolated root already holds TEMP, HOME and GOCACHE.
      - name: Exclude CI work directories from Defender
        shell: pwsh
        run: |
          $root = 'C:\private\tmp\claude-501\pregate-ci'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $targets = @([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE), [IO.Path]::GetFullPath($root))
          foreach ($path in $targets) { Add-MpPreference -ExclusionPath $path }
          $kept = @((Get-MpPreference).ExclusionPath)
          foreach ($path in $targets) {
            if (-not ($kept | Where-Object { $_ -ieq $path })) { throw "Defender did not keep the exclusion for $path" }
            Write-Output "Defender exclusion: $path"
          }
      - name: Git identity for fixture commits
        shell: pwsh
        run: |
          git config --global user.email "pregate-ci@example.com"
          git config --global user.name "Pregate CI"
          git config --global commit.gpgsign false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        if: matrix.shard == 1
      - name: Documentation matches CLI and rule manifests
        if: matrix.shard == 1
        run: |
          bun scripts/core-invariants.ts --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/readiness-packs.ts --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/dcouplr-delivery-rules.ts --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/source-invariants.ts --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/invariant-coverage.ts --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/docs-reference.ts --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/catch-all-lint.ts --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The demo keeps its own empty GOCACHE (no network, no user cache). Compiling this module
      # once first loads the toolchain and the standard library into the OS cache, which is the
      # difference between the timed-out first Go demo and the passing run that followed it.
      - name: Warm the Go toolchain
        shell: pwsh
        working-directory: examples/demo/go
        env:
          GOCACHE: C:/private/tmp/claude-501/pregate-ci/go-cache
          GOPATH: C:/private/tmp/claude-501/pregate-ci/gopath
          GOTMPDIR: C:/private/tmp/claude-501/pregate-ci/tmp
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path $env:GOCACHE, $env:GOPATH, $env:GOTMPDIR | Out-Null
          go version
          go test ./...
      # Four of the ignored suites execute POSIX shell fixtures; native Windows equivalents are in
      # supervisor.e2e and windows-distribution.e2e. bench-latency.e2e runs scripts/bench.ts, which
      # the `latency (windows-latest)` job runs on this platform with the gate. Every other suite
      # runs here once, runtime, onboarding and the native bootstrap included.
      - name: Unit and native end-to-end tests
        id: windows-suite
        # Each file gets a fresh global object; the selected tests stay unchanged. The hosted Windows
        # runner starts a compiled engine several times slower than macOS or Linux, so a test with no
        # deadline of its own gets 20 s here in place of Bun's 5 s. A suite's own deadline still wins.
        run: bun test --isolate --timeout 20000 --shard=${{ matrix.shard }}/3 --path-ignore-patterns 'test/{launcher.e2e,machine.e2e,dist.e2e,default-contract-budget.e2e,e2e,repo-hygiene.e2e,bench-latency.e2e}.test.ts'
      # Preserve the full-suite failure. Independent fresh processes help distinguish
      # a repeatable product defect from an accumulated test-runtime failure.
      - name: Diagnose failing Windows suites in fresh processes
        if: failure() && steps.windows-suite.outcome == 'failure'
        shell: pwsh
        run: |
          bun --version
          git --version
          foreach ($suite in @('audit', 'library', 'onboard', 'packs', 'ratchet', 'state')) {
            Write-Output "Fresh-process diagnostic: test/$suite.test.ts"
            bun test "test/$suite.test.ts"
            Write-Output "Diagnostic exit code: $LASTEXITCODE"
          }
          exit 0
      - run: bun src/main.ts rules test catalog
        if: matrix.shard == 1
      - name: Windows archive
        if: matrix.shard == 1
        run: bun run scripts/build.ts windows-x64
      - name: Dogfooding
        if: matrix.shard == 1
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "$env:BASE^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $env:BASE = git merge-base origin/main HEAD 2>$null
            if ($LASTEXITCODE -ne 0) { $env:BASE = git rev-list --max-parents=0 HEAD | Select-Object -Last 1 }
          }
          bun src/main.ts check --ratchet --base $env:BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows:
    needs: windows-suite
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every Windows shard passed
        env:
          RESULT: ${{ needs.windows-suite.result }}
        run: test "$RESULT" = "success"
  windows-bootstrap:
    needs: test
    # Collect native evidence for a built candidate even if its later self-gate fails.
    # The original failing job still blocks admission; publication is unchanged.
    if: ${{ !cancelled() && needs.test.outputs.candidate_ready == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: C:/private/tmp/claude-501/pregate-cross/download
      - name: Bootstrap the Linux-built Windows release
        shell: pwsh
        run: |
          $root = 'C:/private/tmp/claude-501/pregate-cross'
          $paths = @{ HOME='home'; USERPROFILE='home'; LOCALAPPDATA='data'; APPDATA='config'; XDG_DATA_HOME='data'; XDG_STATE_HOME='state'; XDG_CONFIG_HOME='config'; TMPDIR='tmp'; TEMP='tmp'; TMP='tmp'; CODEX_HOME='codex'; GROK_HOME='grok' }
          foreach ($entry in $paths.GetEnumerator()) {
            $path = "$root/$($entry.Value)"
            New-Item -ItemType Directory -Path $path -Force | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key, $path, 'Process')
          }
          # setup exits 1 when it wires no harness. An empty Claude home is the one this bootstrap can wire.
          New-Item -ItemType Directory -Path "$root/home/.claude" -Force | Out-Null
          # Without AppData\Local under USERPROFILE, PowerShell writes this cache into its working directory.
          [Environment]::SetEnvironmentVariable('PSModuleAnalysisCachePath', "$root/powershell-module-analysis-cache", 'Process')
          $download = "$root/download"
          $archive = Get-ChildItem "$download/pregate-*-windows-x64.zip" | Select-Object -First 1
          $version = $archive.Name -replace '^pregate-(.+)-windows-x64.zip$', '$1'
          foreach ($name in @($archive.Name, 'install.ps1')) {
            $line = Get-Content "$download/SHA256SUMS" | Where-Object { $_ -match ('  ' + [regex]::Escape($name) + '$') } | Select-Object -First 1
            if (!$line -or (Get-FileHash "$download/$name" -Algorithm SHA256).Hash -ine $line.Substring(0,64)) { throw "Checksum mismatch: $name" }
          }
          $env:PREGATE_ARCHIVE = $archive.FullName
          $env:PREGATE_SHA256 = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash
          & "$download/install.ps1" -Version $version
          $cli = "$env:XDG_DATA_HOME/pregate/bin/pregate.cmd"
          if ((& $cli --version) -notlike "pregate $version (core *)") { throw 'Installed version mismatch' }
          & $cli update --engine $version
          if ($LASTEXITCODE -ne 0) { throw 'Engine update failed' }
          & $cli update --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Update failed' }
          $env:PREGATE_UNATTENDED_APPROVAL = '1'
          & $cli uninstall --purge --yes
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed' }
          for ($n = 0; $n -lt 100 -and (Test-Path "$env:XDG_DATA_HOME/pregate"); $n++) { Start-Sleep -Milliseconds 50 }
          if (Test-Path "$env:XDG_DATA_HOME/pregate") { throw 'Deferred uninstall failed' }
  native-release:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.candidate_ready == 'true' }}
    uses: ./.github/workflows/native-release.yml
    permissions:
      contents: read
  # The 150 ms p95 budget belongs to the reference machine (ARCHITECTURE O31). These runners
  # compare the median of three p95 samples with bench/latency-baseline.json and fail above 55%.
  # The required status check on main is named bench, so the ubuntu-latest job keeps that name.
  bench:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: bench
          - os: macos-latest
            check: latency (macos-latest)
          - os: windows-latest
            check: latency (windows-latest)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Exclude CI work directories from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targets = @([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE), [IO.Path]::GetFullPath($env:RUNNER_TEMP))
          foreach ($path in $targets) { Add-MpPreference -ExclusionPath $path }
      - name: Isolate runtime homes
        shell: bash
        run: |
          root="${RUNNER_TEMP}/pregate-bench"
          mkdir -p "$root/home" "$root/data" "$root/state" "$root/config" "$root/tmp" "$root/codex" "$root/grok"
          {
            echo "HOME=$root/home"
            echo "USERPROFILE=$root/home"
            echo "XDG_DATA_HOME=$root/data"
            echo "XDG_STATE_HOME=$root/state"
            echo "XDG_CONFIG_HOME=$root/config"
            echo "TMPDIR=$root/tmp"
            echo "TEMP=$root/tmp"
            echo "TMP=$root/tmp"
            echo "CODEX_HOME=$root/codex"
            echo "GROK_HOME=$root/grok"
          } >> "$GITHUB_ENV"
      - name: Git identity for the bench repository
        shell: bash
        run: |
          git config --global user.email "pregate-ci@example.com"
          git config --global user.name "Pregate CI"
          git config --global commit.gpgsign false
      - run: bun install --frozen-lockfile
      - name: Compile bench engine once
        shell: bash
        run: bun scripts/compiled-engine.ts
      - name: Compiled Pre hook latency
        shell: bash
        run: |
          bun scripts/bench.ts --runs 25 --repeat 3 --inform --gate bench/latency-baseline.json \
            --only "200 lines, first touch" \
            --only "200 lines, second touch" \
            --only "2,000 lines, first touch" \
            --only "2,000 lines, second touch"
