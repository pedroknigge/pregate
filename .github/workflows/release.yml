# The release (MULTI-HARNESS MH-32): a tag v<x>, where x is package.json's version, publishes all
# archives and installers only after `test` passes and the same packaged candidates pass native
# bootstrap and product smoke on every target. `publish` needs `test`, then signs each archive and
# SHA256SUMS with keyless cosign (GitHub OIDC) and records a build-provenance attestation.
# Post-publication checks also verify the GitHub download path, including those bundles.
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install test shells
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Isolate runtime homes
        run: |
          root=/private/tmp/claude-501/pregate-release
          sudo mkdir -p "$root"
          sudo chown "$(id -u):$(id -g)" "$root"
          for entry in HOME:home XDG_DATA_HOME:data XDG_STATE_HOME:state XDG_CONFIG_HOME:config TMPDIR:tmp CODEX_HOME:codex GROK_HOME:grok; do
            path="$root/${entry#*:}"
            mkdir -p "$path"
            echo "${entry%%:*}=$path" >> "$GITHUB_ENV"
          done
      - run: bun install --frozen-lockfile
      - name: The tag is package.json's version
        run: test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./package.json").version')"
      - run: bun run typecheck
      - run: bun test
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Isolate runtime homes
        run: |
          root=/private/tmp/claude-501/pregate-release
          sudo mkdir -p "$root"
          sudo chown "$(id -u):$(id -g)" "$root"
          for entry in HOME:home XDG_DATA_HOME:data XDG_STATE_HOME:state XDG_CONFIG_HOME:config TMPDIR:tmp CODEX_HOME:codex GROK_HOME:grok; do
            path="$root/${entry#*:}"
            mkdir -p "$path"
            echo "${entry%%:*}=$path" >> "$GITHUB_ENV"
          done
      - run: bun install --frozen-lockfile
      # rules test catalog, every target, install.sh and SHA256SUMS; it refuses an install.sh whose
      # DEFAULT_VERSION is not package.json's.
      - run: bun run build
      - run: bun run manifests
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            dist/pregate-*.tar.gz
            dist/pregate-*.zip
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
            dist/pregate.rb
            dist/pregate.json
  native:
    needs: build
    uses: ./.github/workflows/native-release.yml
    permissions:
      contents: read
  publish:
    needs: [test, build, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - uses: sigstore/cosign-installer@v4.1.1
      - name: Sign archives and SHA256SUMS
        run: |
          set -euo pipefail
          files=(dist/pregate-*.tar.gz dist/pregate-*.zip dist/SHA256SUMS)
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "missing release file: $f" >&2; exit 1; }
            # Keyless: GitHub OIDC, Fulcio certificate, Rekor entry, written as a Sigstore bundle.
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/pregate-*.tar.gz
            dist/pregate-*.zip
            dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pre=
          case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; esac
          notes="Install on macOS or Linux:

              curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh | sh

          Install on Windows PowerShell:

              irm https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.ps1 | iex

          Each archive and SHA256SUMS has a Sigstore bundle (.bundle) from cosign sign-blob (GitHub OIDC) and a GitHub artifact attestation. Verification steps are in docs/guides/installation.md."
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $pre --title "$GITHUB_REF_NAME" \
            --notes "$notes" dist/pregate-*.tar.gz dist/pregate-*.zip dist/install.sh dist/install.ps1 dist/SHA256SUMS dist/pregate.rb dist/pregate.json dist/*.bundle
  bootstrap:
    needs: publish
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The literal bootstrap of MH-32 in an empty HOME, except that gh names the tag: without one it
      # takes the latest release, which a pre-release is not. cosign is installed so install.sh
      # verifies the keyless bundles this workflow just published.
      - uses: sigstore/cosign-installer@v4.1.1
      - name: Bootstrap on a clean machine
        env:
          GH_TOKEN: ${{ github.token }}
          PREGATE_REQUIRE_SIGNATURE: "1"
        run: |
          set -eu
          root=/private/tmp/claude-501/pregate-bootstrap
          if [ "$(uname -s)" = Linux ]; then
            sudo mkdir -p "$root"
            sudo chown "$(id -u):$(id -g)" "$root"
          fi
          for entry in HOME:home XDG_DATA_HOME:data XDG_STATE_HOME:state XDG_CONFIG_HOME:config TMPDIR:tmp CODEX_HOME:codex GROK_HOME:grok; do
            path="$root/${entry#*:}"
            mkdir -p "$path"
            export "${entry%%:*}=$path"
          done
          d=$(mktemp -d) && gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern install.sh --pattern SHA256SUMS --dir "$d" \
            && (cd "$d" && shasum -a 256 -c --ignore-missing SHA256SUMS) && sh "$d/install.sh"
          # --version prints the engine and the builtin core version: "pregate X.Y.Z (core A.B.C)".
          case "$("$HOME/.local/bin/pregate" --version)" in "pregate ${GITHUB_REF_NAME#v} (core "*")") ;; *) exit 1 ;; esac
  windows-bootstrap:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: sigstore/cosign-installer@v4.1.1
      - name: Bootstrap and update on native Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREGATE_REQUIRE_SIGNATURE: "1"
        run: |
          $root = 'C:/private/tmp/claude-501/pregate-bootstrap'
          $paths = @{ HOME='home'; USERPROFILE='home'; LOCALAPPDATA='data'; APPDATA='config'; XDG_DATA_HOME='data'; XDG_STATE_HOME='state'; XDG_CONFIG_HOME='config'; TMPDIR='tmp'; TEMP='tmp'; TMP='tmp'; CODEX_HOME='codex'; GROK_HOME='grok' }
          foreach ($entry in $paths.GetEnumerator()) {
            $path = "$root/$($entry.Value)"
            New-Item -ItemType Directory -Path $path -Force | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key, $path, 'Process')
          }
          # Without AppData\Local under USERPROFILE, PowerShell writes this cache into its working directory.
          [Environment]::SetEnvironmentVariable('PSModuleAnalysisCachePath', "$root/powershell-module-analysis-cache", 'Process')
          $download = "$root/download"
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern install.ps1 --pattern SHA256SUMS --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap download failed' }
          $line = Get-Content "$download/SHA256SUMS" | Where-Object { $_ -match '  install.ps1$' } | Select-Object -First 1
          if (!$line -or (Get-FileHash "$download/install.ps1" -Algorithm SHA256).Hash -ine $line.Substring(0,64)) { throw 'Installer SHA-256 mismatch' }
          & "$download/install.ps1" -Version $env:GITHUB_REF_NAME
          $cli = "$env:XDG_DATA_HOME/pregate/bin/pregate.cmd"
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ((& $cli --version) -notlike "pregate $version (core *)") { throw 'Installed version mismatch' }
          $archive = "pregate-$version-windows-x64.zip"
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $archive --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Update driver download failed' }
          $archiveSum = Get-Content "$download/SHA256SUMS" | Where-Object { $_ -match ('  ' + [regex]::Escape($archive) + '$') } | Select-Object -First 1
          if (!$archiveSum -or (Get-FileHash "$download/$archive" -Algorithm SHA256).Hash -ine $archiveSum.Substring(0,64)) { throw 'Update driver checksum mismatch' }
          Expand-Archive "$download/$archive" "$root/driver"
          Remove-Item "$env:XDG_DATA_HOME/pregate/$version/pregate.exe"
          & "$root/driver/pregate.exe" update --engine $version
          if ($LASTEXITCODE -ne 0) { throw 'Engine update failed' }
          & $cli update --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Update failed' }
          & $cli uninstall --purge
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed' }
