name: "Pregate"
description: "Pre-execution and CI architectural & invariant gate for AI coding agents and repositories"
author: "Pedro Knigge"
branding:
  icon: "shield"
  color: "green"

inputs:
  version:
    description: "Pregate release version (e.g. 0.0.10). scripts/build.ts requires this to match package.json."
    required: false
    default: "0.0.10"
  mode:
    description: "Command mode: check (whole tree) | audit | ratchet (requires base)"
    required: false
    default: "check"
  base:
    description: "Git base ref or SHA. Required when mode is ratchet; the action fails before running if it is empty."
    required: false
    default: ""
  args:
    description: "Extra arguments for check and audit. Empty uses the mode default: check passes --all, audit passes none. Ratchet ignores this and always runs check --ratchet --base."
    required: false
    default: ""
  sarif:
    description: "Optional path to write SARIF 2.1.0 report for GitHub Code Scanning"
    required: false
    default: ""
  sarif-file:
    description: "Alias for sarif: optional path to write SARIF 2.1.0 report"
    required: false
    default: ""
  require-signature:
    description: "Install cosign and refuse a release whose Sigstore bundle is missing or does not verify. Set to false to install on SHA-256 alone (e.g. a release cut before signing)."
    required: false
    default: "true"
  accept-contract:
    description: "Contract loosening digests (printed by a failing ratchet) that a maintainer accepts. Pass a repository variable (vars.PREGATE_ACCEPT_CONTRACT), never a value the change under check can set."
    required: false
    default: ""
  github-token:
    description: "Token gh uses to verify the GitHub artifact attestation of the download. Defaults to github.token."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    # Pinned by commit: sigstore/cosign-installer v4.1.1 (cosign 3.x), the same release the
    # publish job signs with.
    - name: Install cosign
      if: inputs.require-signature == 'true'
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
    - name: Install Pregate
      shell: bash
      env:
        PREGATE_VERSION: ${{ inputs.version }}
        PREGATE_REQUIRE_SIGNATURE: ${{ inputs.require-signature == 'true' && '1' || '' }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-install.sh"
    - name: Run Pregate Gate
      shell: bash
      env:
        PREGATE_MODE: ${{ inputs.mode }}
        PREGATE_BASE: ${{ inputs.base }}
        PREGATE_ARGS: ${{ inputs.args }}
        PREGATE_SARIF: ${{ inputs.sarif || inputs.sarif-file }}
        PREGATE_ACCEPT_CONTRACT: ${{ inputs.accept-contract }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-run.sh"
