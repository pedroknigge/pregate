name: "Pregate"
description: "Pre-execution and CI architectural & invariant gate for AI coding agents and repositories"
author: "Pedro Knigge"
branding:
  icon: "shield"
  color: "green"

inputs:
  version:
    description: "Pregate release version (e.g. 0.0.1)"
    required: false
    default: "0.0.1"
  mode:
    description: "Command mode: check | ratchet | audit"
    required: false
    default: "check"
  base:
    description: "Git base ref or SHA when mode is ratchet"
    required: false
    default: ""
  args:
    description: "Additional arguments passed to pregate (e.g. --all)"
    required: false
    default: "--all"
  sarif:
    description: "Optional path to write SARIF 2.1.0 report for GitHub Code Scanning"
    required: false
    default: ""
  sarif-file:
    description: "Alias for sarif: optional path to write SARIF 2.1.0 report"
    required: false
    default: ""
  require-signature:
    description: "Install cosign and refuse a release whose Sigstore bundle is missing or does not verify. Set to false to install on SHA-256 alone (e.g. a release cut before signing)."
    required: false
    default: "true"
  github-token:
    description: "Token gh uses to verify the GitHub artifact attestation of the download. Defaults to github.token."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    # Pinned by commit: sigstore/cosign-installer v4.1.1 (cosign 3.x), the same release the
    # publish job signs with.
    - name: Install cosign
      if: inputs.require-signature == 'true'
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
    - name: Install Pregate
      shell: bash
      env:
        PREGATE_VERSION: ${{ inputs.version }}
        PREGATE_REQUIRE_SIGNATURE: ${{ inputs.require-signature == 'true' && '1' || '' }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-install.sh"
    - name: Run Pregate Gate
      shell: bash
      env:
        PREGATE_MODE: ${{ inputs.mode }}
        PREGATE_BASE: ${{ inputs.base }}
        PREGATE_ARGS: ${{ inputs.args }}
        PREGATE_SARIF: ${{ inputs.sarif || inputs.sarif-file }}
      run: |
        set -euo pipefail
        if [ -n "$PREGATE_SARIF" ]; then
          if [ "$PREGATE_MODE" = "audit" ]; then
            pregate audit $PREGATE_ARGS --sarif > "$PREGATE_SARIF"
          elif [ "$PREGATE_MODE" = "ratchet" ] && [ -n "$PREGATE_BASE" ]; then
            pregate check --ratchet --base "$PREGATE_BASE" --format sarif > "$PREGATE_SARIF"
          else
            pregate check $PREGATE_ARGS --format sarif > "$PREGATE_SARIF"
          fi
        else
          if [ "$PREGATE_MODE" = "ratchet" ] && [ -n "$PREGATE_BASE" ]; then
            pregate check --ratchet --base "$PREGATE_BASE"
          else
            pregate "$PREGATE_MODE" $PREGATE_ARGS
          fi
        fi
